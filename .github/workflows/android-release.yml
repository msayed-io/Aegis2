name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional semantic version without the v prefix, for example 1.0.12"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run JVM tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

  release:
    name: Build, sign, and publish Release
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            version_name="$REQUESTED_VERSION"
          else
            version_name="1.0.${RUN_NUMBER}"
          fi
          if ! printf '%s' "$version_name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release_version: expected MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version_code=$((100000 + RUN_NUMBER))
          tag="v${version_name}"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Materialize signing keystore in runner temp
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease bundleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }}

      - name: Verify release outputs and signing metadata
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          test "$(stat -c '%s' "$apk")" -gt 0
          test "$(stat -c '%s' "$aab")" -gt 0
          "$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$apk"
          sha256sum "$apk" "$aab" | tee release-checksums.txt

      - name: Upload durable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-${{ steps.version.outputs.tag }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            release-checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach APK/AAB
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Aegis $VERSION_NAME" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            release-checksums.txt

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
