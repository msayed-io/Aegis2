name: Android Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional semantic version without the v prefix, for example 1.0.12"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run JVM tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

  release:
    name: Build, sign, and publish Release
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            version_name="$REQUESTED_VERSION"
          else
            version_name="1.0.${RUN_NUMBER}"
          fi
          if ! printf '%s' "$version_name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release_version: expected MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version_code=$((100000 + RUN_NUMBER))
          tag="v${version_name}"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Materialize signing keystore in runner temp
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Verify signing-key continuity with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          keytool_details="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")"
          current_fingerprint="$(printf '%s\n' "$keytool_details" \
            | sed -nE 's/^[[:space:]]*SHA[-]?256:[[:space:]]*(.*)$/\1/p' \
            | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$current_fingerprint" ]; then
            echo "Could not extract SHA-256 fingerprint from keytool output." >&2
            exit 1
          fi
          echo "Current signing certificate fingerprint: $current_fingerprint"
          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [ -n "$latest_tag" ]; then
            mkdir -p "$RUNNER_TEMP/previous-release"
            gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.apk' --dir "$RUNNER_TEMP/previous-release"
            previous_apk="$(find "$RUNNER_TEMP/previous-release" -type f -name '*.apk' -print -quit)"
            if [ -z "$previous_apk" ]; then
              echo "Could not find an APK in latest release $latest_tag." >&2
              exit 1
            fi
            apksigner_details="$("$apksigner" verify --print-certs "$previous_apk")"
            previous_fingerprint="$(printf '%s\n' "$apksigner_details" \
              | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*(.*)$/\1/p' \
              | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$previous_fingerprint" ]; then
              echo "Could not extract SHA-256 fingerprint from apksigner output." >&2
              exit 1
            fi
            echo "Latest release $latest_tag certificate fingerprint: $previous_fingerprint"
            if [ "$current_fingerprint" != "$previous_fingerprint" ]; then
              echo "Signing key mismatch: refusing to create an incompatible update." >&2
              exit 1
            fi
            echo "Signing certificate matches latest release $latest_tag."
          else
            echo "No previous release exists; continuity check skipped."
          fi

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }}

      - name: Verify release outputs and signing metadata
        run: |
          set -euo pipefail
          apk_source="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          aab_source="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$apk_source"
          test -n "$aab_source"
          mkdir -p release-files
          apk="release-files/Onyx-${{ steps.version.outputs.version_name }}.apk"
          aab="release-files/Onyx-${{ steps.version.outputs.version_name }}.aab"
          cp "$apk_source" "$apk"
          cp "$aab_source" "$aab"
          test "$(stat -c '%s' "$apk")" -gt 0
          test "$(stat -c '%s' "$aab")" -gt 0
          "$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$apk"
          sha256sum "$apk" "$aab" | tee release-checksums.txt

      - name: Upload durable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-${{ steps.version.outputs.tag }}-${{ github.sha }}
          path: |
            release-files/*.apk
            release-files/*.aab
            release-checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach APK/AAB
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Onyx $VERSION_NAME" \
            --generate-notes \
            release-files/*.apk \
            release-files/*.aab \
            release-checksums.txt

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
